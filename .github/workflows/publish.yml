name: Publish

# Publishes the three things a TypeScript, Go or container user installs, on
# every push to the default branch:
#
#   npm   @howlerops/trigon-client   npmjs.com (trusted publishing, see below)
#                                    and GitHub Packages (npm.pkg.github.com)
#   go    github.com/howlerops/trigon/sdk/go   a sdk/go/vX.Y.Z tag
#   image ghcr.io/howlerops/trigon   GitHub Container Registry
#
# The npm package and the Go tag are versioned by the contract
# (spec/openapi.json `info.version`), so a push that does not change the
# contract publishes nothing new for them: a version is published once and
# never overwritten. The image is rebuilt on every push and tagged `latest`,
# the commit, and the contract version.
#
# The repository's own token does all of it; no secret is needed. Only the
# default branch publishes, so a fork's pull request never reaches it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      contract: ${{ steps.read.outputs.contract }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "contract=$(python3 -c 'import json;print(json.load(open("spec/openapi.json"))["info"]["version"])')" >> "$GITHUB_OUTPUT"

  npm:
    needs: version
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@howlerops"
      - name: The package version is the contract version
        env:
          CONTRACT: ${{ needs.version.outputs.contract }}
        run: test "$(node -p 'require("./package.json").version')" = "$CONTRACT"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Publish unless this version exists
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTRACT: ${{ needs.version.outputs.contract }}
        run: |
          if npm view "@howlerops/trigon-client@$CONTRACT" version >/dev/null 2>&1; then
            echo "@howlerops/trigon-client@$CONTRACT is already published"
          else
            npm publish --registry https://npm.pkg.github.com
          fi

  # npmjs.com, where `npm install @howlerops/trigon-client` works with no
  # token (GitHub Packages asks for one on every install, public or not).
  #
  # Trusted publishing: npmjs.com accepts this workflow's short-lived GitHub
  # OIDC identity instead of a stored NPM_TOKEN, and attaches a provenance
  # attestation tying each version to the commit and run that built it. It is
  # configured on the package's settings page on npmjs.com, so the package has
  # to exist first; until that one-time setup is done this job is switched off
  # by the NPMJS_TRUSTED_PUBLISHING repository variable rather than failing
  # every push to main.
  npmjs:
    needs: version
    if: ${{ github.ref_name == github.event.repository.default_branch && vars.NPMJS_TRUSTED_PUBLISHING == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - name: The package version is the contract version
        env:
          CONTRACT: ${{ needs.version.outputs.contract }}
        run: test "$(node -p 'require("./package.json").version')" = "$CONTRACT"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Publish unless this version exists
        env:
          CONTRACT: ${{ needs.version.outputs.contract }}
        run: |
          if npm view "@howlerops/trigon-client@$CONTRACT" version >/dev/null 2>&1; then
            echo "@howlerops/trigon-client@$CONTRACT is already on npmjs.com"
          else
            npm publish --access public --provenance
          fi

  go:
    needs: version
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: The module builds and vets
        working-directory: sdk/go
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
      - name: Tag the module unless this version exists
        env:
          TAG: sdk/go/v${{ needs.version.outputs.contract }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

  image:
    needs: version
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=The Trigon gateway: typed, calibrated decisions in one forward pass
            org.opencontainers.image.licenses=Apache-2.0
          tags: |
            ghcr.io/howlerops/trigon:latest
            ghcr.io/howlerops/trigon:${{ github.sha }}
            ghcr.io/howlerops/trigon:${{ needs.version.outputs.contract }}
      - name: The published image answers
        run: |
          docker run -d --name smoke -p 8000:8000 ghcr.io/howlerops/trigon:${{ github.sha }}
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/healthz && exit 0; sleep 2; done
          docker logs smoke; exit 1
