name: CI

# Every branch, not just `main`. This once said `branches: [main]` while the
# repository had no `main` -- its default branch was the one the work was on --
# so the workflow never ran once. `main` exists now (2026-09-25), and the
# lesson stands: every branch. A CI configuration that cannot fire is
# indistinguishable from a green one, which is the worse half of that.
on:
  push:
  pull_request:

# A pull request from a branch in this repository would otherwise run the
# matrix twice, once for the push and once for the PR. Cancelling the older
# run is right for the fast jobs: a superseded commit's test result is not
# worth the minutes.
#
# `reference-run` opts out below, and for a reason worth stating: it is a
# four-seed sweep that takes about half an hour, and under this group every
# commit pushed during it threw the whole thing away. Twenty of one day's
# twenty-six runs were cancelled that way, which is why A.4 has never
# produced the measurement it exists for.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# The token every job gets can read the repository and nothing else. No job
# here writes to it, and a public repository's workflows should not be able to.
permissions:
  contents: read

jobs:
  test:
    # Which machine runs this. `vars.CI_RUNNER` (a repository variable, e.g.
    # the label of the self-hosted fly.io runner) when it is set, GitHub's
    # otherwise -- and **always GitHub's for a pull request from a fork**. A
    # public repository's fork PRs run code nobody here has reviewed, and on a
    # self-hosted runner that code runs on our machine, with its network and
    # whatever it can reach. GitHub's own guidance is never to expose a
    # self-hosted runner to them, so the expression below does not leave it
    # to a setting.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The ledger drift test counts commits, and the default depth-1
          # checkout reports 1 -- so the test failed saying the ledger claimed
          # 105 commits against 1. The test was right about the repository and
          # wrong about the checkout; this gives it the history it is reading.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # The torch extra is installed CPU-only: the independence tests are the
        # ones that prove the architectural claims, so they must run in CI.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # `train` as well, for numpy: the CPU torch wheel does not pull it,
          # and without it twenty-two tests fail with "Numpy is not available"
          # from inside torch. torch itself is already satisfied by the line
          # above, so this adds numpy and nothing else.
          pip install -e ".[dev,server,llm,train]"
      - name: Lint
        run: ruff check src tests scripts sdk
      - name: Format check
        run: ruff format --check src tests scripts sdk
      - name: Test
        # Includes tests/test_end_to_end.py, which trains a tiny model and
        # drives it through the gateway and the generated SDK. It is the only
        # test that would have caught either of the two components this repo
        # shipped green-in-unit-tests and broken end to end.
        run: pytest -q
      - name: OpenAPI spec is current
        run: |
          python scripts/export_openapi.py
          git diff --exit-code spec/openapi.json
      - name: TypeScript client typechecks
        # Nobody reads generated code, so the compiler is the review. Strict
        # mode here caught a real bug the first time it ran.
        working-directory: sdk/typescript
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Generated artifacts are current
        # Each is generated from something else in the tree, so a change that
        # is not regenerated has to fail in the same commit rather than later.
        run: |
          python scripts/generate_sdk.py --check
          python scripts/attention_table.py --write
          git diff --exit-code docs/architecture.md

  evals:
    # The eval harness is the durable asset, so it runs on every change. The
    # lexical floor fails the calibration gates by design, which is why this
    # job reports the suites rather than gating on them.
    # The same runner rule as `test`: never self-hosted for a fork's PR.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,server]"
      - name: Jaggedness suite
        run: trigon eval jaggedness -n 50 --out reports/jaggedness.md
      - name: Calibration suite
        # The lexical floor fails the ECE gate by design, and a 300-case run
        # fails the sample-size gate too. Both are the gates working; this job
        # publishes the numbers rather than blocking on them.
        run: trigon eval calibration -n 300 --out reports/calibration.md || true
      - name: Cardinality recall gate
        # Decision D1's falsifier. Capped below the full sweep because the
        # 10k-option pass takes minutes; the nightly job runs the whole range.
        run: trigon eval cardinality -n 100 --cardinality-max 1024
      - name: Workflow suite
        run: trigon eval workflow -n 150 --out reports/workflows.md
      - uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: reports/

  reference-run:
    # The closed loop: train the reference model, calibrate it, run the gates.
    # Minutes rather than seconds, so it is not on the pull-request path.
    if: github.event_name == 'push'
    # Push only, so only people who can push reach it: the self-hosted runner
    # is safe here without the fork check.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Its own group, and **not** cancel-in-progress. A half-hour sweep that is
    # discarded by the next docs commit never finishes, which is what happened
    # to every attempt at A.4's measurement. Sweeps queue behind each other
    # instead; the result is late rather than absent.
    concurrency:
      group: reference-run-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,server,train]"
      - name: Sweep the reference configuration on this hardware
        # **A single draw is not evidence, and that rule applies to CI too.**
        # This job used to train one seed and gate on it. The first time it
        # ran, that draw failed -- choice accuracy 0.530 where the four
        # certified runs read 0.648 to 0.849 -- and the reason is written in
        # scripts/seed_sweep.py's own docstring: "a perturbation far smaller
        # than a seed change, the summation order of a batched matmul, is
        # enough to move a given seed from one outcome to the other".
        # tests/test_prefix_cache.py shows this hardware *has* a different
        # summation order. Hardware is a second axis of the seed problem and
        # nobody had swept it.
        #
        # So it sweeps four seeds here, the way the rule says to. --jobs 4
        # because each run is single-threaded by design, so that is cores
        # rather than oversubscription.
        #
        # `--require none` publishes the spread without gating on it, which is
        # deliberate and temporary: the point of this change is to *get* the
        # four-seed measurement on this hardware. docs/next.md A.4 says what
        # happens next -- block on the verdict once it is known, or replace
        # the configuration with one whose outcome does not depend on which
        # machine trains it.
        run: |
          python scripts/seed_sweep.py --seeds 0 1 2 3 --jobs 4 \
            -n 8000 --eval-n 6000 --epochs 8 --lr 0.01 \
            --d-model 128 --layers 2 --noise 0.2 --option-scoring auto \
            --out-dir reports/ci-sweep --name ci --require none --keep-reports \
            | tee reports/ci-sweep-summary.txt
          {
            echo "## Reference configuration, four seeds on this hardware"
            echo
            echo '```'
            cat reports/ci-sweep-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: reference-run
          path: reports/
