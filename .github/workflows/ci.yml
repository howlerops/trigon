name: CI

# Every branch, not just `main`. This said `branches: [main]` and this
# repository has no `main` -- its default branch is the one the work is on --
# so the workflow had never run once. A CI configuration that cannot fire is
# indistinguishable from a green one, which is the worse half of that.
on:
  push:
  pull_request:

# A pull request from a branch in this repository would otherwise run the
# matrix twice, once for the push and once for the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # The torch extra is installed CPU-only: the independence tests are the
        # ones that prove the architectural claims, so they must run in CI.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,server,llm]"
      - name: Lint
        run: ruff check src tests scripts sdk
      - name: Format check
        run: ruff format --check src tests scripts sdk
      - name: Test
        # Includes tests/test_end_to_end.py, which trains a tiny model and
        # drives it through the gateway and the generated SDK. It is the only
        # test that would have caught either of the two components this repo
        # shipped green-in-unit-tests and broken end to end.
        run: pytest -q
      - name: OpenAPI spec is current
        run: |
          python scripts/export_openapi.py
          git diff --exit-code spec/openapi.json
      - name: TypeScript client typechecks
        # Nobody reads generated code, so the compiler is the review. Strict
        # mode here caught a real bug the first time it ran.
        working-directory: sdk/typescript
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Generated artifacts are current
        # Each is generated from something else in the tree, so a change that
        # is not regenerated has to fail in the same commit rather than later.
        run: |
          python scripts/generate_sdk.py --check
          python scripts/attention_table.py --write
          git diff --exit-code docs/architecture.md

  evals:
    # The eval harness is the durable asset, so it runs on every change. The
    # lexical floor fails the calibration gates by design, which is why this
    # job reports the suites rather than gating on them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,server]"
      - name: Jaggedness suite
        run: trigon eval jaggedness -n 50 --out reports/jaggedness.md
      - name: Calibration suite
        # The lexical floor fails the ECE gate by design, and a 300-case run
        # fails the sample-size gate too. Both are the gates working; this job
        # publishes the numbers rather than blocking on them.
        run: trigon eval calibration -n 300 --out reports/calibration.md || true
      - name: Cardinality recall gate
        # Decision D1's falsifier. Capped below the full sweep because the
        # 10k-option pass takes minutes; the nightly job runs the whole range.
        run: trigon eval cardinality -n 100 --cardinality-max 1024
      - name: Workflow suite
        run: trigon eval workflow -n 150 --out reports/workflows.md
      - uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: reports/

  reference-run:
    # The closed loop: train the reference model, calibrate it, run the gates.
    # Minutes rather than seconds, so it is not on the pull-request path.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,server,train]"
      - name: Train, calibrate, gate
        # The certified configuration from reports/iso/, not the older
        # single-seed reference run. That one passes on seed 0 and fails on a
        # different draw of the same flags, so gating CI on it gates main on a
        # coin flip -- and a perturbation far smaller than a seed change is
        # enough to move a given seed from one outcome to the other. This
        # configuration clears every blocking gate on all four seeds tried.
        #
        # --save-model because a report about a model nobody can reload is a
        # claim rather than a result, and because scripts/regate.py can then
        # re-run the gates against those weights without retraining.
        run: >
          trigon train -n 8000 --eval-n 6000 --epochs 8 --lr 0.01
          --d-model 128 --layers 2 --noise 0.2 --option-scoring auto
          --out reports/ci-run.md --save-model reports/ci-run.pt
      - uses: actions/upload-artifact@v4
        with:
          name: reference-run
          path: reports/
