[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trigon"
version = "0.1.0"
description = "Open-source System One: prefill-only, typed, calibrated decision model and serving stack"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Trigon contributors" }]
keywords = ["calibration", "classification", "inference", "system-one", "typed-outputs"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core package is deliberately dependency-light: schema compilation, the
# calibration layer and the eval metrics are pure Python so they can be
# imported by the gateway, by training code and by CI without a GPU stack.
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27", "pyyaml>=6"]
llm = ["httpx>=0.27"]
train = ["torch>=2.2", "numpy>=1.26"]
# Only `scripts/modal_train.py` needs this, and only on the machine that
# launches the job -- the GPU container installs its own dependencies from the
# image spec in that file. Kept out of `train` so a CPU box fitting a
# reference model does not pull a job runner it will never call.
gpu = ["modal>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "pyyaml>=6", "ruff>=0.5"]

[project.scripts]
trigon = "trigon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# data/*.json carries the BPE vocabulary, which ships with the package: the
# gateway counts tokens on nodes with no model weights, so it cannot be a
# runtime download.
trigon = ["py.typed", "evals/suites/*.json", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:trigon.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
